<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5263"/>
    </marker>
    <style>
      .title { font-size: 28px; font-weight: 700; fill: #1f2430; }
      .h { font-size: 20px; font-weight: 700; fill: #1f2430; }
      .hs { font-size: 14px; fill: #5a6070; font-style: italic; }
      .b { font-size: 15px; font-weight: 600; fill: #1f2430; }
      .s { font-size: 12.5px; fill: #5a6070; }
      .lbl { font-size: 13px; fill: #4b5263; font-style: italic; }
      .wire { stroke: #4b5263; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="920" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="title">How the two projects fit together</text>

  <!-- Config -->
  <rect x="500" y="78" width="400" height="72" rx="12" fill="#fffbe6" stroke="#c9a400" stroke-width="2"/>
  <text x="700" y="108" text-anchor="middle" class="b">Model config file</text>
  <text x="700" y="130" text-anchor="middle" class="s">all the sizes and settings, decided once</text>

  <path class="wire" marker-end="url(#arrow)" d="M600 150 V180 H280 V206"/>
  <path class="wire" marker-end="url(#arrow)" d="M800 150 V180 H1000 V206"/>
  <text x="440" y="173" text-anchor="middle" class="lbl">what to build</text>
  <text x="900" y="173" text-anchor="middle" class="lbl">exact sizes to plan for</text>

  <!-- Transformer project -->
  <rect x="40" y="210" width="480" height="360" rx="16" fill="#eef4ff" stroke="#4a6fd1" stroke-width="2"/>
  <text x="280" y="242" text-anchor="middle" class="h">Transformer from scratch</text>
  <text x="280" y="264" text-anchor="middle" class="hs">the French → English model: WHAT to compute</text>

  <rect x="65" y="280" width="430" height="48" rx="10" fill="#ffffff" stroke="#4a6fd1" stroke-width="1.5"/>
  <text x="280" y="300" text-anchor="middle" class="b">Tokenizer &amp; data</text>
  <text x="280" y="318" text-anchor="middle" class="s">French/English pairs → numbers, one shared 8k or 16k vocabulary</text>

  <rect x="65" y="338" width="430" height="48" rx="10" fill="#ffffff" stroke="#4a6fd1" stroke-width="1.5"/>
  <text x="280" y="358" text-anchor="middle" class="b">Encoder stack (N layers)</text>
  <text x="280" y="376" text-anchor="middle" class="s">reads the French sentence and understands it</text>

  <rect x="65" y="396" width="430" height="48" rx="10" fill="#ffffff" stroke="#4a6fd1" stroke-width="1.5"/>
  <text x="280" y="416" text-anchor="middle" class="b">Decoder stack (N layers)</text>
  <text x="280" y="434" text-anchor="middle" class="s">writes English, looking back at the encoder's understanding</text>

  <rect x="65" y="454" width="430" height="48" rx="10" fill="#ffffff" stroke="#4a6fd1" stroke-width="1.5"/>
  <text x="280" y="474" text-anchor="middle" class="b">Training script</text>
  <text x="280" y="492" text-anchor="middle" class="s">teaches the model from translated sentence pairs</text>

  <rect x="65" y="512" width="430" height="48" rx="10" fill="#ffffff" stroke="#4a6fd1" stroke-width="1.5"/>
  <text x="280" y="532" text-anchor="middle" class="b">Translation script</text>
  <text x="280" y="550" text-anchor="middle" class="s">French in, English out, one word at a time</text>

  <!-- houssem_torch -->
  <rect x="640" y="210" width="720" height="360" rx="16" fill="#eefaf3" stroke="#2f9a5d" stroke-width="2"/>
  <text x="1000" y="242" text-anchor="middle" class="h">houssem_torch</text>
  <text x="1000" y="264" text-anchor="middle" class="hs">the engine: HOW to compute it, as fast as possible</text>

  <rect x="670" y="285" width="660" height="56" rx="10" fill="#ffffff" stroke="#2f9a5d" stroke-width="1.5"/>
  <text x="1000" y="309" text-anchor="middle" class="b">Building blocks</text>
  <text x="1000" y="328" text-anchor="middle" class="s">the operations the model is made of: multiply, add, attention, cross-attention, ...</text>

  <!-- model <-> engine (drawn after the panel so both arrowheads show) -->
  <path class="wire" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M497 391 C580 391, 590 313, 668 313"/>
  <text x="578" y="300" text-anchor="middle" class="lbl">asks for work,</text>
  <text x="578" y="316" text-anchor="middle" class="lbl">gets results</text>

  <path class="wire" marker-end="url(#arrow)" d="M1000 341 V363"/>

  <rect x="670" y="365" width="660" height="56" rx="10" fill="#ffffff" stroke="#2f9a5d" stroke-width="1.5"/>
  <text x="1000" y="389" text-anchor="middle" class="b">Planner</text>
  <text x="1000" y="408" text-anchor="middle" class="s">reads the config once, lays out the whole run and all memory in advance</text>

  <path class="wire" marker-end="url(#arrow)" d="M770 421 V448"/>
  <path class="wire" marker-end="url(#arrow)" d="M1225 421 V448"/>

  <rect x="670" y="450" width="200" height="96" rx="10" fill="#ffffff" stroke="#2f9a5d" stroke-width="1.5"/>
  <text x="770" y="477" text-anchor="middle" class="b">Reference engine</text>
  <text x="770" y="497" text-anchor="middle" class="s">simple and slow,</text>
  <text x="770" y="513" text-anchor="middle" class="s">the source of truth</text>
  <text x="770" y="533" text-anchor="middle" class="s">(your laptop)</text>

  <rect x="900" y="450" width="190" height="96" rx="10" fill="#f7f7f7" stroke="#2f9a5d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="995" y="477" text-anchor="middle" class="b">Checker</text>
  <text x="995" y="497" text-anchor="middle" class="s">answers must match;</text>
  <text x="995" y="513" text-anchor="middle" class="s">PyTorch gives a</text>
  <text x="995" y="529" text-anchor="middle" class="s">second opinion</text>

  <rect x="1120" y="450" width="210" height="96" rx="10" fill="#ffffff" stroke="#2f9a5d" stroke-width="1.5"/>
  <text x="1225" y="477" text-anchor="middle" class="b">Fast engine</text>
  <text x="1225" y="497" text-anchor="middle" class="s">combined GPU programs,</text>
  <text x="1225" y="513" text-anchor="middle" class="s">made for your exact sizes</text>
  <text x="1225" y="533" text-anchor="middle" class="s">(Kaggle GPUs)</text>

  <path class="wire" marker-end="url(#arrow)" d="M870 498 H898"/>
  <path class="wire" marker-end="url(#arrow)" d="M1120 498 H1092"/>

  <!-- engine -> hardware -->
  <path class="wire" marker-end="url(#arrow)" d="M1225 546 V605 H450 V636"/>
  <text x="840" y="597" text-anchor="middle" class="lbl">runs on</text>

  <!-- Kaggle -->
  <rect x="40" y="640" width="820" height="210" rx="16" fill="#fff5e8" stroke="#d98a1f" stroke-width="2"/>
  <text x="450" y="672" text-anchor="middle" class="h">Kaggle machine</text>
  <text x="450" y="692" text-anchor="middle" class="hs">two GPUs, time-limited sessions</text>

  <rect x="75" y="708" width="225" height="74" rx="10" fill="#ffffff" stroke="#d98a1f" stroke-width="1.5"/>
  <text x="187" y="736" text-anchor="middle" class="b">GPU 1 (T4)</text>
  <text x="187" y="756" text-anchor="middle" class="s">full copy of the model,</text>
  <text x="187" y="771" text-anchor="middle" class="s">half of the data</text>

  <rect x="420" y="708" width="225" height="74" rx="10" fill="#ffffff" stroke="#d98a1f" stroke-width="1.5"/>
  <text x="532" y="736" text-anchor="middle" class="b">GPU 2 (T4)</text>
  <text x="532" y="756" text-anchor="middle" class="s">full copy of the model,</text>
  <text x="532" y="771" text-anchor="middle" class="s">the other half</text>

  <path class="wire" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M302 745 H418"/>
  <text x="360" y="735" text-anchor="middle" class="lbl">share learning</text>
  <text x="360" y="764" text-anchor="middle" class="lbl">every step</text>

  <rect x="690" y="708" width="145" height="74" rx="10" fill="#ffffff" stroke="#d98a1f" stroke-width="1.5"/>
  <text x="762" y="736" text-anchor="middle" class="b">Checkpoints</text>
  <text x="762" y="756" text-anchor="middle" class="s">saved progress,</text>
  <text x="762" y="771" text-anchor="middle" class="s">resume next session</text>
  <path class="wire" marker-end="url(#arrow)" d="M647 745 H688"/>

  <text x="450" y="823" text-anchor="middle" class="s">Each GPU learns from different data; they combine what they learned so both stay identical.</text>

  <!-- Speed ladder -->
  <rect x="900" y="640" width="460" height="210" rx="16" fill="#f5f0ff" stroke="#7a5bd1" stroke-width="2"/>
  <text x="1130" y="672" text-anchor="middle" class="h">Speed ladder</text>
  <text x="1130" y="692" text-anchor="middle" class="hs">how deep each fast program goes</text>

  <rect x="925" y="708" width="230" height="38" rx="8" fill="#ffffff" stroke="#7a5bd1" stroke-width="1.5"/>
  <text x="1040" y="732" text-anchor="middle" class="b">1 · Readable GPU code</text>
  <rect x="985" y="755" width="230" height="38" rx="8" fill="#ffffff" stroke="#7a5bd1" stroke-width="1.5"/>
  <text x="1100" y="779" text-anchor="middle" class="b">2 · Near-assembly</text>
  <rect x="1045" y="802" width="230" height="38" rx="8" fill="#ffffff" stroke="#7a5bd1" stroke-width="1.5"/>
  <text x="1160" y="826" text-anchor="middle" class="b">3 · Machine code</text>

  <text x="1180" y="716" class="s">go one step deeper</text>
  <text x="1180" y="732" class="s">only where measuring</text>
  <text x="1180" y="748" class="s">shows it pays off</text>

  <!-- footer -->
  <text x="700" y="892" text-anchor="middle" class="lbl" style="font-size:15px">The working loop: write a fast program → check it against the reference → measure it → improve it</text>
</svg>
