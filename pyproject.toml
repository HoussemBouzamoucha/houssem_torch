[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "houssem_torch"
version = "0.1.0"
description = "A small deep-learning framework built from scratch"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
fusion = [
    "numba>=0.60",
]
cuda = [
    # CuPy plus only the CUDA libraries the engine uses (no toolkit needed).
    "cupy-cuda12x>=14.0",
    "nvidia-cublas-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cuda-runtime-cu12",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "tabulate>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["houssem_torch*"]

[tool.setuptools.package-data]
"houssem_torch.backends.cuda" = ["*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_level = "INFO"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W"]